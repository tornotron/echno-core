name: CI

# Verifies every PR and push to the working branches. echno-core is a shared
# library consumed across the org, so its development branch must always
# typecheck and pass its tests before anything is published on release.

on:
  pull_request:
    branches: [development, staging, production]
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (pinned to the lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
