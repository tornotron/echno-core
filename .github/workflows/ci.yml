name: CI

# Verifies every PR and push to the working branches. echno-core is a shared
# library consumed across the org, so its development branch must always
# typecheck and pass its tests before anything is published on release.

on:
  pull_request:
    branches: [development, staging, production]
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (pinned to the lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The production config excludes the test files so they stay out of
      # `dist`, and `bun test` transpiles without checking types, so without
      # this step nothing typechecks a test file anywhere. Several tests here
      # are compile-time pins on the published interfaces; an unchecked pin
      # holds nothing.
      - name: Typecheck the tests
        run: bun run typecheck:tests

      - name: Public API snapshot up to date
        run: bun run api:check
      - name: Request contract check
        run: bun run contract:check

      - name: Test
        run: bun test

  # Generates a throwaway domain from scripts/scaffold/templates and checks
  # it the way a real one would be checked, so a template that drifts from
  # the package (a renamed helper, a changed api-client signature, a new
  # exports map rule) fails the PR that broke it. `ci-probe` is never
  # committed. The generated tests run on their own rather than under the
  # whole suite because the request-contract guard, correctly, reports a
  # write call against an endpoint the backend document does not have.
  scaffold-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (pinned to the lockfile)
        run: bun install --frozen-lockfile

      - name: Scaffold the probe domain
        run: bun run scaffold:domain ci-probe "CI Probe"

      - name: Typecheck with the probe in place
        run: bun run typecheck && bun run typecheck:tests

      - name: Test the generated layers and the generator
        run: bun test src/types/ci-probe src/services/ci-probe-service.test.ts src/hooks/ci-probe scripts/scaffold-domain.test.ts

      - name: Discard the probe
        run: git clean -fdq src && git checkout -- src/index.ts && git status --short
